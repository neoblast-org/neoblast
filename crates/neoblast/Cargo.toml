[package]
name = "neoblast"
description = "Censorship-resistant P2P storage: encrypted, erasure-coded shards that heal without keys. Experimental; not audited."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
# The tests read spec/ and tools/ from the repository, so they stay out of the package.
exclude = ["tests/"]
readme = "../../README.md"
keywords = ["storage", "p2p", "erasure-coding", "encryption", "censorship"]
categories = ["cryptography", "filesystem", "command-line-utilities"]

[[bin]]
name = "neoblast"
path = "src/main.rs"

[dependencies]
neoblast-format.workspace = true
neoblast-crypto.workspace = true
neoblast-erasure.workspace = true
blake3.workspace = true
clap.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[dev-dependencies]
proptest.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true

[lints]
workspace = true
