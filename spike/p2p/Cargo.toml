# The libp2p or iroh spike (ROADMAP item 6; plans/todo/p2p-library-spike.md).
# Throwaway measurement code, outside the main workspace like fuzz/ and
# bench/heal-heap: CI, cargo deny and Dependabot do not build or watch it.
[workspace]
resolver = "3"
members = ["common", "libp2p", "iroh"]

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal", "io-std", "io-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
p2p-spike-common = { path = "common" }
