[package]
name = "p2p-spike-iroh"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "spike-iroh"
path = "src/main.rs"

[dependencies]
iroh = "=1.4.1"
clap.workspace = true
p2p-spike-common.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# Its in-process relay, for the tests on one machine.
iroh = { version = "=1.4.1", features = ["test-utils"] }
