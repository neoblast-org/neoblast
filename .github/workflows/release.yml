name: Release

# Publishes all four crates to crates.io when a version tag is pushed.
# Uses crates.io trusted publishing: no long-lived token is stored anywhere.
# See RELEASING.md. The first release of each crate is done by hand.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Everything that runs third-party code (build scripts, tests) happens here,
  # in a job that cannot request a publishing token.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.97.0"
      - name: Tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Tag is the project's, in UTC
        # As the hygiene job checks (S-015, S-017, S-022), with the same
        # check (.github/checks/tag-object.awk, W-031), but before anything
        # is published. Prints nothing about the tagger.
        shell: bash
        run: |
          test "$(git for-each-ref "$GITHUB_REF" --format='%(objecttype) %(type)')" = "tag commit"
          if ! git cat-file tag "$GITHUB_REF" | .github/checks/object.sh tag "$GITHUB_REF_NAME"; then
            echo "::error::The tag must be made of a commit, by neoblast maintainers <dev@neoblast.dev> in UTC, with only its name as message."; exit 1
          fi
      - name: Tag matches the workspace version
        run: |
          versions=$(cargo metadata --no-deps --format-version 1 | jq -r '[.packages[].version] | unique | .[]')
          echo "workspace version(s): $versions, tag: $GITHUB_REF_NAME"
          test "$(echo "$versions" | wc -l)" -eq 1
          test "v$versions" = "$GITHUB_REF_NAME"
      # An advisory published since the last merge stops the release too
      # (S-023): #25 reached main while its deny check was failing.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
      - run: cargo test --workspace --locked
      - name: Golden vectors unchanged
        run: git diff --exit-code spec/test-vectors
      - run: cargo publish --workspace --locked --dry-run

  publish:
    needs: verify
    runs-on: ubuntu-latest
    # Needs a maintainer's approval, and crates.io only trusts tokens requested
    # from this environment.
    environment: release
    permissions:
      contents: read
      id-token: write # exchanged for a short-lived crates.io token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.97.0"
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      # Already verified in the job above, so nothing is built or run here.
      - run: cargo publish --workspace --locked --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
