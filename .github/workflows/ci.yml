name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # Actions are pinned to full commit SHAs; the comment gives the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.97.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets
      - run: cargo test --all
      - name: Golden vectors unchanged
        run: git diff --exit-code spec/test-vectors

  vectors:
    # The v1 vectors were frozen at the Phase 1 gate (spec/test-vectors/README.md).
    # A format change gets a new magic or suite byte and its own vector file;
    # these two files never change, so their hashes are pinned here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Frozen v1 vectors unchanged
        run: |
          sha256sum --check --strict <<'EOF'
          4136f00ec286fbffd127e6ee1a2eb76a1032f2f9c16d627753ac426ee7d9be49  spec/test-vectors/phase1.json
          1b58fc1a0f3e79e542a007373d215f997f745b9024ff8505d40204b49a978ba6  spec/test-vectors/erasure-leopard.json
          EOF

  heal-heap:
    # Counts the manifest's copies exactly (bench/heal-heap/, outside the
    # workspace, so `cargo test --all` does not reach it).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.97.0"
      - run: cargo test --locked --manifest-path bench/heal-heap/Cargo.toml

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.87"
      - run: cargo +1.87 check --all
        env:
          RUSTUP_TOOLCHAIN: "1.87"
