name: Commit hygiene

on:
  push:
  pull_request:

permissions:
  contents: read

# Every step prints only commit hashes or tag names, so a failure never
# repeats a name, an address or a time zone in the public log (S-012).
jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: No tool-session links in commit messages
        run: |
          bad=$(git log -i -E --grep='claude\.ai/code/session|^claude-session:' --format=%h)
          if [ -n "$bad" ]; then
            echo "::error::These commit messages link to a private tool session. Rewrite them before merging:"
            echo "$bad"; exit 1
          fi
      - name: Maintainer commits are recorded in UTC
        # Only commits made on a maintainer's machine are checked. Commits GitHub
        # creates itself (the pull-request test merge, squash merges) have GitHub
        # as committer and carry the account's time zone, so they are skipped.
        shell: bash
        run: |
          bad=$(git log --no-merges --format='%h|%ae|%ce|%ad|%cd' --date=format:%z \
            | awk -F'|' '$2=="dev@neoblast.dev" && $3!="noreply@github.com" && ($4!="+0000" || $5!="+0000") { print $1 }')
          if [ -n "$bad" ]; then
            echo "::error::Maintainer commits must use UTC timestamps:"; echo "$bad"; exit 1
          fi
      - name: Commits carry only the project's identity
        # Every commit after 5393f67, when this rule began, must be authored and
        # committed as the project in UTC, and any Co-authored-by or
        # Signed-off-by trailer must name the project too (S-008). Merge commits
        # count. A pull request is checked at its own head, which leaves out the
        # test merge GitHub makes. Dependabot's commits fail by design: re-make
        # the change as a project commit.
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          start=5393f6704b5059c4c8ecfbb6adc01718c13c4455
          git rev-parse --verify --quiet "$HEAD_SHA^{commit}" >/dev/null
          bad=$(git log --date=format:%z "$start..$HEAD_SHA" \
              --format='%h%x09%an <%ae>%x09%cn <%ce>%x09%ad%x09%cd%x09%(trailers:key=Co-authored-by,key=Signed-off-by,valueonly,unfold,separator=%x3B)' \
            | awk -F'\t' -v me='neoblast maintainers <dev@neoblast.dev>' '
                $1 !~ /^[0-9a-f]+$/ || NF != 6 { print "(unparsable line)"; next }
                { tr = $6; gsub(/neoblast maintainers <dev@neoblast\.dev>/, "", tr); gsub(/[; ]/, "", tr) }
                $2 != me || $3 != me || $4 != "+0000" || $5 != "+0000" || tr != "" { print $1 }')
          if [ -n "$bad" ]; then
            echo "::error::Only neoblast maintainers <dev@neoblast.dev>, in UTC, may author, commit, co-author or sign off. Re-make these commits:"
            echo "$bad"; exit 1
          fi
      - name: Object and message checks pass their tests
        # The steps that read commit and tag objects as stored, and commit
        # messages, run the checks in .github/checks/, which the Release
        # workflow shares (W-031). Their tests run first, under every awk the
        # runner has and on objects git itself writes; then every mutation in
        # mutate.sh must make a test fail.
        run: |
          .github/checks/test.sh
          .github/checks/mutate.sh
      - name: Commit headers hold nothing else
        # The step above reads git's parsed fields only. A merge of a signed
        # tag adds a mergetag header holding that tag's tagger, and another
        # header could hold a name too, so a commit after 5393f67 may have only
        # tree, parent, author, committer and an SSH signature, whose lines
        # may hold only base64 (S-022), laid out as git writes one with a
        # plain ed25519 key, as a certificate's or text in its reserved field
        # would carry a name (S-030), and a message with no control byte but
        # a tab (S-025). See .github/checks/commit-object.awk.
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          start=5393f6704b5059c4c8ecfbb6adc01718c13c4455
          git rev-parse --verify --quiet "$HEAD_SHA^{commit}" >/dev/null
          bad=$(git log --format=%H "$start..$HEAD_SHA" | while read -r h; do
            if ! git cat-file commit "$h" | .github/checks/object.sh commit; then
              git rev-parse --short "$h"
            fi
          done)
          if [ -n "$bad" ]; then
            echo "::error::Commits may have only tree, parent, author, committer and gpgsig headers, by neoblast maintainers <dev@neoblast.dev> in UTC, signed with a plain ed25519 key, and no control byte but a tab in their message. Re-make these commits:"
            echo "$bad"; exit 1
          fi
      - name: No mailmap
        # A .mailmap at the top of the tree, in any case, makes git log,
        # shortlog and blame show other names and addresses for the
        # project's, which the identity step does not see, as it reads the
        # commits' own (S-031). Every commit after 5393f67 is checked, so
        # one added and then removed in a pull request fails too. See
        # .github/checks/tree.awk.
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          start=5393f6704b5059c4c8ecfbb6adc01718c13c4455
          git rev-parse --verify --quiet "$HEAD_SHA^{commit}" >/dev/null
          bad=$(git log --format=%H "$start..$HEAD_SHA" | while read -r h; do
            tree=$(git ls-tree "$h") || exit 1
            if ! printf '%s\n' "$tree" | .github/checks/object.sh tree; then
              git rev-parse --short "$h"
            fi
          done)
          if [ -n "$bad" ]; then
            echo "::error::No commit may hold a .mailmap. Re-make these commits:"
            echo "$bad"; exit 1
          fi
      - name: No attribution lines naming anyone else
        # Any "<something>-by:" line anywhere in a message after 5393f67, not
        # only in git's trailer block, must name the project (S-013). A lone
        # carriage return also ends a line, and any byte but a letter, digit,
        # space, tab or colon counts as the hyphen, so a Unicode one cannot hide a
        # line either (S-018); nor can an indented line that git folds into
        # one (S-028). See .github/checks/message.awk.
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          start=5393f6704b5059c4c8ecfbb6adc01718c13c4455
          git rev-parse --verify --quiet "$HEAD_SHA^{commit}" >/dev/null
          # Full hashes: a tag named like a short hash cannot stand in for a commit.
          bad=$(git log --format=%H "$start..$HEAD_SHA" | while read -r h; do
            msg=$(git log -1 --format=%B "$h") || exit 1
            if ! printf '%s\n' "$msg" | .github/checks/object.sh message; then
              git rev-parse --short "$h"
            fi
          done)
          if [ -n "$bad" ]; then
            echo "::error::Attribution lines (Co-authored-by:, Reviewed-by: and so on) may only name neoblast maintainers <dev@neoblast.dev>. Re-make these commits:"
            echo "$bad"; exit 1
          fi
      - name: Tags carry only the project's identity
        # Every tag must be annotated, by the project, in UTC (S-015), and
        # point at a commit: a tag of a tag would publish the inner tag's
        # identity too (S-017). The tag object is read as it is stored: only
        # those four headers, and as message only the tag's name and an
        # SSH-armored block of base64, so no other header or line can hold a
        # name (S-022). See .github/checks/tag-object.awk. Only tag names are
        # printed.
        shell: bash
        run: |
          # The tags were fetched: v0.0.1 is there, annotated.
          git rev-parse --verify --quiet 'refs/tags/v0.0.1^{tag}' >/dev/null
          bad=$(git for-each-ref refs/tags --format='%(refname:lstrip=2)%09%(objecttype)' \
            | while IFS=$'\t' read -r name type; do
            if [ "$type" != tag ] || ! git cat-file tag "refs/tags/$name" | .github/checks/object.sh tag "$name"; then
              printf '%s\n' "$name"
            fi
          done)
          if [ -n "$bad" ]; then
            echo "::error::Tags must be annotated, of a commit, by neoblast maintainers <dev@neoblast.dev> in UTC, with only their name as message. Re-make these tags:"
            echo "$bad"; exit 1
          fi
