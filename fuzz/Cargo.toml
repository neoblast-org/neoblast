[package]
name = "neoblast-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
neoblast-format = { path = "../crates/neoblast-format" }
neoblast-erasure = { path = "../crates/neoblast-erasure" }
neoblast = { path = "../crates/neoblast" }

[[bin]]
name = "header_decode"
path = "fuzz_targets/header_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "link_parse"
path = "fuzz_targets/link_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "manifest_decode"
path = "fuzz_targets/manifest_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "open_hostile_shards"
path = "fuzz_targets/open_hostile_shards.rs"
test = false
doc = false
bench = false

[[bin]]
name = "erasure_restore"
path = "fuzz_targets/erasure_restore.rs"
test = false
doc = false
bench = false
